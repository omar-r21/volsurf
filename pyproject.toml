[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "0.1.0"
description = "Option pricing, implied volatility and arbitrage-checked SVI volatility surfaces"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Omar Rayan" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
